name: portbw candidate regression (feature branch only)
on:
  push:
    branches:
      - opt/portbw-cpu-snapshot-index-20261016
    paths:
      - 'portbw.py'
      - 'portbw-install.sh'
      - 'tests/test_portbw_cpu_candidate.py'
      - 'tests/portbw_cpu_probe.py'
      - 'tests/portbw_ab_lab.sh'
      - '.github/workflows/portbw-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portbw-safety-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax and shell syntax
        run: |
          python3 -m py_compile portbw.py tests/test_portbw_cpu_candidate.py tests/portbw_cpu_probe.py
          bash -n portbw-install.sh
          if [ -f tests/portbw_ab_lab.sh ]; then bash -n tests/portbw_ab_lab.sh; fi
      - name: Run differential nft and tc regression tests
        run: python3 -m unittest discover -s tests -p 'test_portbw_cpu_candidate.py' -v
      - name: Assert installer matches candidate code SHA
        shell: bash
        run: |
          actual="$(sha256sum portbw.py | awk '{print $1}')"
          expected="$(sed -n "s/^EXPECTED_SHA='\([a-f0-9]*\)'$/\1/p" portbw-install.sh)"
          test -n "$expected"
          test "$actual" = "$expected"
      - name: Guard production branch and production mode
        run: |
          test "${GITHUB_REF_NAME}" = "opt/portbw-cpu-snapshot-index-20261016"
          grep -q 'check_isolation()' tests/portbw_cpu_probe.py
