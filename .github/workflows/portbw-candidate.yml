name: portbw candidate regression (feature branch only)
on:
  push:
    branches:
      - candidate/portbw-generic-dual-auto-20261018
    paths:
      - 'portbw.py'
      - 'portbw-install.sh'
      - 'portbw-onekey.sh'
      - 'portbw-generic.sh'
      - 'portbw-migrate-legacy.py'
      - 'tests/test_portbw_cpu_candidate.py'
      - 'tests/test_portbw_auto_sustained_window.py'
      - 'tests/portbw_helan_auto_window_accept.sh'
      - 'tests/test_portbw_semantic_acceptance.py'
      - 'tests/portbw_cpu_probe.py'
      - 'tests/portbw_helan_ab.sh'
      - 'tests/portbw_ab_lab_runner.py'
      - 'tests/portbw_lab_traffic.py'
      - 'tests/portbw_lab_outbound_traffic.py'
      - 'tests/portbw_lab_semantics.py'
      - 'tests/portbw_lab_outbound_traffic.py'
      - 'tests/portbw_lab_semantic_runner.py'
      - 'tests/portbw_helan_semantic.sh'
      - 'tests/portbw_helan_release_smoke.sh'
      - 'tests/verify_portbw_semantic_harness.py'
      - 'tests/portbw_helan_up_diagnose.py'
      - 'tests/portbw_lab_tcp_goodput.py'
      - 'tests/portbw_helan_tcp_goodput.sh'
      - 'tests/portbw_helan_burst_fix.sh'
      - 'tests/portbw_helan_burst_semantic.sh'
      - 'tests/portbw_helan_live_path_diagnose.py'
      - 'tests/portbw_lab_egress_tcp_goodput.py'
      - 'tests/test_portbw_egress_lab_paths.py'
      - 'tests/portbw_helan_egress_tcp_goodput.sh'
      - 'tests/portbw_helan_bidirectional_accept.sh'
      - 'tests/portbw_helan_burst_semantic.sh'
      - '.github/workflows/portbw-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portbw-safety-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax and shell syntax
        run: |
          python3 -m py_compile portbw.py tests/test_portbw_cpu_candidate.py tests/portbw_cpu_probe.py tests/portbw_ab_lab_runner.py tests/portbw_lab_traffic.py tests/portbw_lab_outbound_traffic.py tests/portbw_lab_semantics.py tests/portbw_lab_outbound_traffic.py tests/portbw_lab_semantic_runner.py tests/test_portbw_semantic_acceptance.py tests/verify_portbw_semantic_harness.py
          bash -n portbw-install.sh
          bash -n portbw-onekey.sh
          bash -n portbw-generic.sh
          python3 -m py_compile portbw-migrate-legacy.py
          python3 -m py_compile tests/portbw_helan_up_diagnose.py tests/portbw_lab_tcp_goodput.py tests/portbw_helan_live_path_diagnose.py
          bash -n tests/portbw_helan_tcp_goodput.sh
          bash -n tests/portbw_helan_burst_fix.sh
          python3 -m py_compile tests/portbw_lab_egress_tcp_goodput.py
          python3 -m unittest discover -s tests -p 'test_portbw_egress_lab_paths.py' -v
          bash -n tests/portbw_helan_egress_tcp_goodput.sh
          bash -n tests/portbw_helan_bidirectional_accept.sh
          bash -n tests/portbw_helan_auto_window_accept.sh
          grep -q -- "--skip-control" tests/portbw_helan_egress_tcp_goodput.sh
          bash -n tests/portbw_helan_burst_semantic.sh
          bash -n tests/portbw_helan_burst_semantic.sh
          bash -n tests/portbw_helan_ab.sh
          bash -n tests/portbw_helan_semantic.sh
          bash -n tests/portbw_helan_release_smoke.sh
          python3 tests/verify_portbw_semantic_harness.py tests/portbw_lab_semantics.py
      - name: Run differential nft and tc regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_portbw_cpu_candidate.py' -v
          python3 -m unittest discover -s tests -p 'test_portbw_semantic_acceptance.py' -v
          python3 -m unittest discover -s tests -p 'test_portbw_auto_sustained_window.py' -v
      - name: Verify benchmark host-namespace refusal
        shell: bash
        run: |
          set -e
          if python3 tests/portbw_cpu_probe.py portbw.py --rounds 1 >/tmp/probe.out 2>&1; then
            echo 'DANGER: probe executed in host namespace'; exit 1
          fi
          grep -q 'REFUSED: lab not explicitly enabled' /tmp/probe.out
          if python3 tests/portbw_ab_lab_runner.py --root /tmp/portbw-cpu-test >/tmp/lab.out 2>&1; then
            echo 'DANGER: lab executed in host namespace'; exit 1
          fi
          grep -q 'REFUSED: lab not explicitly enabled' /tmp/lab.out
          if python3 tests/portbw_lab_semantics.py --root /tmp/portbw-cpu-test --source portbw.py --child-pid 1 --label test --suite faults >/tmp/semantic.out 2>&1; then
            echo 'DANGER: semantics ran in host namespace'; exit 1
          fi
          grep -q 'REFUSED: missing explicit test acknowledgement' tests/portbw_lab_semantics.py
          if python3 tests/portbw_lab_semantic_runner.py --root /tmp/portbw-cpu-test --version A --suite faults >/tmp/semantic-runner.out 2>&1; then
            echo 'DANGER: semantics runner ran in host namespace'; exit 1
          fi
          grep -q 'runner.isolated()' tests/portbw_lab_semantic_runner.py
      - name: Validate Helan release pinned hash and upgrade gate
        run: |
          actual="$(sha256sum portbw.py | awk '{print $1}')"
          grep -Fq "EXPECTED_SHA='$actual'" portbw-install.sh
          grep -Fq "EXPECTED_SHA=$actual" portbw-onekey.sh
          grep -q 'preflight_upgrade(){' portbw-install.sh
          grep -Fq 'CURRENT_HELAN_SHA=' portbw-install.sh
          grep -q 'preflight-upgrade' portbw-generic.sh
          grep -q 'clean_install_preflight' portbw-generic.sh
          grep -Fq 'OLD_MAIN_SHA=' portbw-generic.sh
      - name: Guard production branch and production mode
        run: |
          test "${GITHUB_REF_NAME}" = "candidate/portbw-generic-dual-auto-20261018"
          grep -q 'check_isolation()' tests/portbw_cpu_probe.py
